version: 2.1

orbs:
  heroku: circleci/heroku@2.0.0

jobs:
  build:
    docker:
      - image: cimg/node:20.11
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: npm install --ignore-scripts
      - run:
          name: Run tests
          command: npm test
      - run:
          name: Build application
          command: npm run build

workflows:
  build_and_deploy:
    jobs:
      - build
      - heroku/deploy-via-git:
          requires:
            - build
          app-name: ${HEROKU_APP_NAME}
          filters:
            branches:
              only: main
